<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Méta-Comparateur de Prix Tunisie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <header class="text-center my-6">
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tight">
                Comparateur de Prix <span class="text-red-600">Tunisie</span> 🇹🇳
            </h1>
            <p class="text-slate-500 mt-2 font-medium">Recherche simultanée en direct sur 25 boutiques et parapharmacies tunisiennes</p>
        </header>

        <!-- Barre de recherche -->
        <form id="search-form" class="flex gap-2 max-w-3xl mx-auto mb-6 bg-white p-2 rounded-2xl shadow-xl border border-gray-200">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Nom de produit, marque ou modèle (ex: Samsung S23, Tramontina, SVR...)" 
                class="flex-1 px-4 py-3 outline-none text-lg text-slate-800" 
                required
            >
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold px-8 py-3 rounded-xl transition flex items-center gap-2">
                <i class="fa-solid fa-magnifying-glass"></i>
                <span>Comparer</span>
            </button>
        </form>

        <!-- Filtres par catégorie -->
        <div id="category-filters" class="hidden flex flex-wrap justify-center gap-2 mb-8">
            <button onclick="filterCategory('ALL')" class="cat-btn active bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-full transition">Toutes les offres</button>
            <button onclick="filterCategory('High-Tech')" class="cat-btn bg-white hover:bg-gray-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-full border transition">High-Tech & Mobile</button>
            <button onclick="filterCategory('Maison')" class="cat-btn bg-white hover:bg-gray-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-full border transition">Maison & Cuisine</button>
            <button onclick="filterCategory('Électroménager')" class="cat-btn bg-white hover:bg-gray-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-full border transition">Électroménager</button>
            <button onclick="filterCategory('Parapharmacie')" class="cat-btn bg-white hover:bg-gray-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-full border transition">Parapharmacie & Beauté</button>
        </div>

        <!-- Animation de chargement avec texte d'état -->
        <div id="loader" class="hidden text-center py-16">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-red-600 border-t-transparent"></div>
            <p id="loader-text" class="text-slate-600 font-semibold mt-4 text-base">Interrogation simultanée des boutiques en direct...</p>
        </div>

        <!-- Entête des résultats -->
        <div id="results-header" class="hidden flex justify-between items-center mb-6">
            <h2 class="text-xl font-black text-slate-900" id="total-count">Offres disponibles</h2>
            <span class="text-xs bg-green-100 text-green-800 font-bold px-3 py-1 rounded-full">⚡ Trié par prix le moins cher</span>
        </div>

        <!-- Grille des cartes produits -->
        <div id="results" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

        <!-- État vide -->
        <div id="empty-state" class="hidden text-center py-16">
            <i class="fa-solid fa-box-open text-5xl text-gray-300 mb-3"></i>
            <p class="text-gray-500 text-lg font-medium">Aucun produit trouvé pour cette recherche.</p>
        </div>
    </div>

    <script>
        // URL de production sur Render
        const API_BASE_URL = "https://api-comparateur-tunisie.onrender.com";

        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loader-text');
        const results = document.getElementById('results');
        const resultsHeader = document.getElementById('results-header');
        const totalCount = document.getElementById('total-count');
        const emptyState = document.getElementById('empty-state');
        const categoryFilters = document.getElementById('category-filters');

        let allProducts = [];

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            loader.classList.remove('hidden');
            loaderText.textContent = "Interrogation simultanée des boutiques en direct...";
            results.innerHTML = '';
            resultsHeader.classList.add('hidden');
            emptyState.classList.add('hidden');
            categoryFilters.classList.add('hidden');

            // Message préventif au cas où le serveur se réveille
            const wakeUpTimer = setTimeout(() => {
                loaderText.textContent = "⚡ Réveil du serveur Cloud en cours, patientez quelques secondes...";
            }, 5000);

            try {
                const res = await fetch(`${API_BASE_URL}/api/compare?q=${encodeURIComponent(query)}`);
                clearTimeout(wakeUpTimer);

                if (!res.ok) throw new Error("Erreur serveur");

                const data = await res.json();
                loader.classList.add('hidden');

                allProducts = data.results;

                if (!allProducts || allProducts.length === 0) {
                    emptyState.classList.remove('hidden');
                    return;
                }

                categoryFilters.classList.remove('hidden');
                resultsHeader.classList.remove('hidden');
                renderProducts(allProducts);

            } catch (err) {
                clearTimeout(wakeUpTimer);
                loader.classList.add('hidden');
                alert("Le serveur Cloud est en cours de réveil. Veuillez recliquer sur 'Comparer' dans quelques secondes.");
            }
        });

        function renderProducts(items) {
            totalCount.textContent = `${items.length} offre(s) trouvée(s)`;
            results.innerHTML = '';

            items.forEach((item, index) => {
                const isBest = index === 0;
                results.innerHTML += `
                    <div class="bg-white p-5 rounded-2xl border ${isBest ? 'border-green-500 ring-2 ring-green-100 shadow-lg' : 'border-gray-200'} shadow-sm flex flex-col justify-between relative hover:shadow-xl transition duration-200">
                        ${isBest ? `<span class="absolute -top-3 left-4 bg-green-600 text-white text-[11px] font-black tracking-wider px-3 py-0.5 rounded-full uppercase">Meilleur Prix</span>` : ''}
                        
                        <div>
                            <div class="h-44 w-full flex items-center justify-center bg-gray-50 rounded-xl mb-3 overflow-hidden p-2">
                                <img src="${item.image_url || 'https://via.placeholder.com/200?text=Pas+d+image'}" alt="${item.title}" class="max-h-full object-contain">
                            </div>
                            <div class="flex items-center justify-between mb-1.5">
                                <span class="text-xs font-black text-red-600 uppercase tracking-wide">${item.store}</span>
                                <span class="text-[10px] bg-slate-100 text-slate-600 font-semibold px-2 py-0.5 rounded-md">${item.category}</span>
                            </div>
                            <h3 class="font-bold text-slate-800 text-sm line-clamp-2 leading-snug mb-1" title="${item.title}">${item.title}</h3>
                            ${item.reference ? `<span class="inline-block text-[11px] font-mono font-semibold bg-gray-100 text-gray-700 px-2 py-0.5 rounded-md mb-2">Réf: ${item.reference}</span>` : ''}
                        </div>

                        <div class="mt-4 pt-3 border-t border-gray-100 flex items-center justify-between">
                            <div>
                                <div class="text-2xl font-black text-slate-900">${item.price_formatted}</div>
                                <span class="text-[11px] ${item.in_stock ? 'text-green-600 font-semibold' : 'text-red-500 font-semibold'}">
                                    ${item.in_stock ? '● En stock' : '○ Épuisé'}
                                </span>
                            </div>
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="bg-slate-900 hover:bg-red-600 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1">
                                <span>Voir</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(cat) {
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-white hover:bg-gray-100 text-slate-700 text-xs font-bold px-4 py-2 rounded-full border transition";
            });
            event.target.className = "cat-btn active bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-full transition";

            if (cat === 'ALL') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category.toLowerCase().includes(cat.toLowerCase()));
                renderProducts(filtered);
            }
        }
    </script>
</body>
</html>
