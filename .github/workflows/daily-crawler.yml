name: Daily Catalog Crawler

on:
  schedule:
    - cron: "0 3 * * *"    # Tourne automatiquement toutes les nuits à 03h00
  workflow_dispatch:        # Permet de le lancer d'un simple clic quand vous voulez !

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le Crawler vers Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python crawler.py
