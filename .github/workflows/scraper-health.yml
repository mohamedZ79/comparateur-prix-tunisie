name: Scraper Health Check

on:
  schedule:
    - cron: "0 */6 * * *"   # Toutes les 6 heures
  workflow_dispatch:         # Déclenchement manuel
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Smoke test intelligent par catégorie
        run: |
          python - <<'EOF'
          import asyncio, sys
          from scrapers import SCRAPERS
          import httpx

          PARAPHARMACIES = {"paraexpert", "maparatunisie", "mycare", "phyto", "santeparapharmacie", "paraforce", "parashop"}
          CLOUDFLARE_DATACENTER_BLOCKED = {"megapc"}  # Bloqué sur IP GitHub Actions (géré par Playwright)

          async def main():
              failed = {}
              async with httpx.AsyncClient(timeout=12.0) as client:
                  for name, fn in SCRAPERS.items():
                      # 1. Ignorer les sites avec Cloudflare strict en CI datacenter
                      if name in CLOUDFLARE_DATACENTER_BLOCKED:
                          print(f"{name:15} ⏭️ SKIP (Cloudflare bloque les IP Datacenter)")
                          continue

                      # 2. Mot-clé adapté à la catégorie du magasin
                      query = "gel" if name in PARAPHARMACIES else "ventilateur"

                      try:
                          offers = await fn(query, client)
                          status = "✅ OK" if offers else "⚠️ VIDE (0 résultat)"
                          print(f"{name:15} {status} ({len(offers)} offres pour '{query}')")
                          
                          if not offers:
                              # Deuxième tentative avec un mot générique de secours
                              fallback_q = "creme" if name in PARAPHARMACIES else "souris"
                              offers_retry = await fn(fallback_q, client)
                              if offers_retry:
                                  print(f"{name:15} ✅ OK au 2e essai ({len(offers_retry)} offres pour '{fallback_q}')")
                              else:
                                  failed[name] = "0 résultat"
                      except Exception as e:
                          print(f"{name:15} ❌ ERREUR: {e}")
                          # Si c'est un timeout ou 403 sur datacenter, on avertit sans bloquer
                          if "403" in str(e) or "Timeout" in str(e):
                              print(f"{name:15} ⚠️ Avertissement réseau Datacenter (non bloquant)")
                          else:
                              failed[name] = str(e)

              if failed:
                  print(f"\n::warning::{len(failed)} scraper(s) à surveiller : {', '.join(failed)}")
              else:
                  print("\n🎉 Tous les scrapers HTTP ont réussi le test !")

          asyncio.run(main())
          EOF
