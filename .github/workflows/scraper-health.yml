name: Scraper Health Check

on:
  schedule:
    - cron: "0 */6 * * *"   # Toutes les 6 heures
  workflow_dispatch:         # Déclenchement manuel
  push:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Installer les dépendances
        run: pip install -r requirements.txt pytest

      # F-08 (fix) : importe TOUS les modules - aurait détecté l'ImportError
      # match_score (F-01) le jour où il a atterri sur main.
      - name: Import smoke test
        run: python -c "import scrapers, scrapers_browser, crawler, main; print('imports OK')"

      - name: Tests unitaires (parser prix, matching, sécurité)
        run: pytest -q

      - name: Smoke test intelligent par catégorie
        run: |
          python - <<'EOF'
          import asyncio
          import httpx
          from scrapers import SCRAPERS, SHOP_CATEGORY

          # Les ensembles sont DÉRIVÉS du registre (plus de listes
          # fantômes désynchronisées - audit F-08) :
          PARAPHARMACIES = {k for k, v in SHOP_CATEGORY.items()
                            if v == "parapharmacie"}

          async def main():
              failed = {}
              async with httpx.AsyncClient(timeout=12.0) as client:
                  for name, fn in SCRAPERS.items():
                      query = "gel" if name in PARAPHARMACIES else "ventilateur"
                      try:
                          offers = await fn(query, client)
                          status = "OK" if offers else "VIDE (0 resultat)"
                          print(f"{name:15} {status} ({len(offers)} offres)")
                          if not offers:
                              fallback_q = ("creme" if name in PARAPHARMACIES
                                            else "souris")
                              retry = await fn(fallback_q, client)
                              if retry:
                                  print(f"{name:15} OK au 2e essai "
                                        f"({len(retry)} offres)")
                              else:
                                  failed[name] = "0 resultat"
                      except Exception as e:
                          print(f"{name:15} ERREUR: {e}")
                          failed[name] = str(e)

              if failed:
                  print(f"\n::warning::{len(failed)} scraper(s) a surveiller "
                        f": {', '.join(failed)}")
              else:
                  print("\nTous les scrapers HTTP ont reussi le test !")

          asyncio.run(main())
          EOF
