# ================================================================
#  scraper.yml — GitHub Actions
#  Scan automatique des promotions Tunisianet.com.tn
#
#  📅 Planification : tous les jours à 07h00 (heure de Tunis)
#     GitHub Actions utilise le fuseau UTC : 07h00 Tunis = 06h00 UTC
#     (la Tunisie est en UTC+1 toute l'année, sans heure d'été)
#
#  📁 Emplacement OBLIGATOIRE dans votre dépôt GitHub :
#     .github/workflows/scraper.yml
# ================================================================

name: 🛒 Scan Promos Tunisianet

on:
  # --- Déclenchement planifié : chaque matin à 07h00 (Tunis) ---
  schedule:
    - cron: "0 6 * * *"        # minute heure jour mois jour-semaine (UTC)

  # --- Déclenchement manuel depuis l'onglet "Actions" de GitHub ---
  workflow_dispatch:

# Évite deux scans simultanés si le précédent n'est pas terminé
concurrency:
  group: scraper-tunisianet
  cancel-in-progress: false

# Permissions nécessaires pour committer le JSON mis à jour
permissions:
  contents: write

jobs:
  scrape:
    name: Extraire les promotions
    runs-on: ubuntu-latest
    timeout-minutes: 30        # sécurité : le scan dure ~4 min normalement

    steps:
      # ----------------------------------------------------------
      # 1. Récupérer le code du dépôt (scraper.py, data/, etc.)
      # ----------------------------------------------------------
      - name: 📥 Checkout du dépôt
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # 2. Installer Python
      # ----------------------------------------------------------
      - name: 🐍 Configuration de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"                       # met en cache les dépendances
          cache-dependency-path: requirements.txt

      # ----------------------------------------------------------
      # 3. Installer les dépendances du scraper
      # ----------------------------------------------------------
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ----------------------------------------------------------
      # 4. Lancer le scraping asynchrone
      #    --workers 12 : 12 requêtes simultanées max
      #    (valeur raisonnable pour ne pas se faire bloquer)
      # ----------------------------------------------------------
      - name: 🔍 Scraping des promotions Tunisianet
        run: python scraper.py --workers 12

      # ----------------------------------------------------------
      # 5. Sauvegarder le fichier data/promos.json dans le dépôt
      #    uniquement s'il a changé depuis le dernier scan
      # ----------------------------------------------------------
      - name: 💾 Commit des nouvelles données
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/promos.json
          # Commit seulement s'il y a des changements
          if git diff --staged --quiet; then
            echo "Aucun changement détecté — rien à committer."
          else
            git commit -m "🔄 Scan du $(date -u +'%d/%m/%Y %H:%M') UTC — promos actualisées"
            git push
            echo "✅ Données promos.json mises à jour et poussées."
          fi

      # ----------------------------------------------------------
      # 6. Résumé visible dans l'onglet Actions de GitHub
      # ----------------------------------------------------------
      - name: 📊 Résumé du scan
        run: |
          python - <<'EOF'
          import json
          with open("data/promos.json", encoding="utf-8") as f:
              d = json.load(f)
          prods = d.get("products", [])
          # Calcul des stats à la volée depuis la liste des produits
          max_disc = max((p["discount_pct"] for p in prods), default=0)
          avg_disc = round(sum(p["discount_pct"] for p in prods) / len(prods), 1) if prods else 0
          savings  = round(sum(p.get("savings", 0) for p in prods), 3)
          print(f"Produits en promo : {d.get('total_products', len(prods))}")
          print(f"Remise maximale   : -{max_disc} %")
          print(f"Remise moyenne    : -{avg_disc} %")
          print(f"Économies cumulées: {savings} DT")
          print(f"Pages scrapées    : {d.get('pages_scraped', '?')}")
          print(f"Durée du scan     : {d.get('scan_duration_s', '?')} s")
          print(f"Dernier scan      : {d.get('last_scan', '?')}")
          EOF
